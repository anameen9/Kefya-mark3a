<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مذاكرة سلام</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232563eb'/%3E%3Cpath d='M7 8h10M7 12h10M7 16h6' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7ff;--cd:#fff;--tx:#0e1a33;--mu:#5d6d8c;--ln:#dae5fa;--ac:#2563eb;--sh:0 6px 22px #2563eb18;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#091124;--cd:#101b36;--tx:#e8f0ff;--mu:#90a4c8;--ln:#1e2d52;--ac:#4d8bff;--sh:0 6px 22px #0007}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font-family:Cairo,system-ui,"Segoe UI",Tahoma,sans-serif;background-color:var(--bg);background-image:radial-gradient(60% 30% at 85% -5%,#4d8bff2e,transparent);color:var(--tx);min-height:100vh}
svg{width:18px;height:18px;flex:none}
.w{max-width:980px;margin:auto;padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.mu{color:var(--mu)}.sm{font-size:.85rem}
.hd{display:flex;justify-content:space-between;align-items:center}.lg{font-size:1.25rem;font-weight:800}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.tab,.b,.ib{border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:12px;padding:8px 12px;font:inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tab.on,.b{background:var(--ac);color:#fff;border-color:var(--ac)}
.b.g{background:transparent;color:var(--tx);border-color:var(--ln)}.ib{padding:6px 8px;border-radius:10px}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.gr{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}.gr .c{margin:0}
.sc{cursor:pointer;border-top:4px solid var(--k);display:grid;gap:8px;transition:transform .2s}.sc:hover{transform:translateY(-3px)}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 18%,transparent);color:var(--k)}.ico svg{width:24px;height:24px}
.bar{height:8px;border-radius:9px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--k,var(--ac));transition:width .5s}
.bn{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,#2563eb,#38bdf8);margin-bottom:12px}.bn h1{font-size:1.7rem}
.pill{display:inline-block;margin-top:10px;padding:6px 12px;border-radius:99px;background:#ffffff33;font-weight:600}.pill.warn{background:#f59e0b}.pill.hot{background:#ef4444}
.tw{overflow-x:auto}table{border-collapse:collapse;min-width:100%}td,th{padding:8px 10px;text-align:center;border-bottom:1px solid var(--ln);white-space:nowrap;font-size:.9rem}th{color:var(--mu);font-weight:600}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--ln);display:inline-grid;place-items:center;cursor:pointer;color:#fff;flex:none}.ck.on{background:var(--k);border-color:var(--k)}.ck svg{width:16px;height:16px}
.sb{height:150px;border-radius:20px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:14px;color:#fff;font-size:1.6rem;font-weight:800;margin-bottom:12px;background:linear-gradient(#0000,#0009),linear-gradient(135deg,var(--k),#0a1530);background-size:cover;background-position:center}
.lc{border-right:4px solid var(--k)}.tag{font-size:.75rem;padding:2px 8px;border-radius:9px;background:var(--ln)}.nt{white-space:pre-wrap;margin:8px 0;line-height:1.8}
.ims{display:flex;gap:8px;flex-wrap:wrap}.ims img{width:110px;height:110px;object-fit:cover;border-radius:12px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
input,textarea,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:10px;font:inherit;margin:6px 0}
.mo{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:9}
.md{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:18px;width:min(460px,100%);max-height:85vh;overflow:auto}.md h3{margin-bottom:8px}
.ring{position:relative;width:220px;height:220px;margin:14px auto}.ring svg{width:100%;height:100%}.ring circle{fill:none;stroke-width:8}
.tr{stroke:var(--ln)}.tf{stroke:var(--ac);stroke-linecap:round;stroke-dasharray:339.3;transition:stroke-dashoffset 1s linear}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem}
.wk{display:flex;align-items:flex-end;gap:8px;height:120px}.wk div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}.wk i{width:100%;background:var(--ac);border-radius:8px 8px 0 0;display:block}
h2{font-size:1.4rem;display:flex;align-items:center;gap:6px}
.ico{width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--k) calc(var(--p)*1%),var(--ln) 0)}.ico span{width:40px;height:40px;border-radius:50%;background:var(--cd);display:grid;place-items:center}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
body.in .sc{animation:up .55s both}body.in .sc:nth-child(2){animation-delay:.07s}body.in .sc:nth-child(3){animation-delay:.14s}body.in .sc:nth-child(4){animation-delay:.21s}body.in .sc:nth-child(5){animation-delay:.28s}body.in .sc:nth-child(6){animation-delay:.35s}
body,.c,.tab,.b,.ib,input,textarea,select{transition:background-color .3s,color .3s,border-color .3s}
body.fo header,body.fo nav,body.fo main>.c:not(.tcard){display:none}body.fo .tcard{margin-top:12vh}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="w">
<header class="hd"><span class="lg">مذاكرتي</span><div class="row"><button class="ib" id="th" data-a="th"></button><button class="ib" id="hs" data-a="ss"></button></div></header>
<nav id="tabs" class="tabs"></nav>
<main id="m"></main>
</div>
<div id="mo"></div>
<script>
// رابط صورة بانر كل مادة (اختياري، أو ارفع الصورة من زر الصورة داخل المادة)
const BANNERS={phy:'',ana:'',den:'',his:'',bpy:'',bio:''};
const IC={plus:'<path d="M12 5v14M5 12h14"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',check:'<path d="M5 12l5 5 9-10"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',play:'<path d="M7 4l13 8-13 8z"/>',pause:'<path d="M8 4v16M16 4v16"/>',reset:'<path d="M4 12a8 8 0 1 0 3-6M4 4v4h4"/>',music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',next:'<path d="M5 4l10 8-10 8zM19 4v16"/>',back:'<path d="M9 5l7 7-7 7"/>',up:'<path d="M6 15l6-6 6 6"/>',dn:'<path d="M6 9l6 6 6-6"/>',home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',spark:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10c1 1 1 2 1 3h6c0-1 0-2 1-3a6 6 0 0 0-4-10z"/>',cards:'<rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 4h13a1 1 0 0 1 1 1v12"/>',img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',fire:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 1 1 2 1 3-3z"/>'};
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`,ic=n=>svg(IC[n]);
const SUBJ=[
{id:'phy',n:'Physiology',c:'#38bdf8',i:'<path d="M3 12h4l3-8 4 16 3-8h4"/>'},
{id:'ana',n:'Anatomy',c:'#6366f1',i:'<circle cx="12" cy="6" r="3"/><path d="M5 21c0-5 3-8 7-8s7 3 7 8"/>'},
{id:'den',n:'Dental anatomy',c:'#22d3ee',i:'<path d="M7 3C4.5 3 3.5 5 3.5 7.5c0 3.5 2 4.5 2 8C5.5 18 6 21 7.5 21S9.5 16.5 12 16.5 14.5 21 16.5 21s2-3 2-5.5c0-3.5 2-4.5 2-8C20.5 5 19.5 3 17 3c-2 0-3.500 1-5 1S9 3 7 3z"/>'},
{id:'his',n:'Histology',c:'#a78bfa',i:'<circle cx="8" cy="8" r="3.5"/><circle cx="16" cy="9" r="3"/><circle cx="11" cy="16" r="3.5"/>'},
{id:'bpy',n:'Biophysics',c:'#3b82f6',i:'<circle cx="12" cy="12" r="1.5"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/>'},
{id:'bio',n:'Biomaterials',c:'#14b8a6',i:'<path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/>'}];
const TABS=[['home','الرئيسية','home'],['ai','الذكاء','spark'],['timer','التايمر','timer'],['stats','إحصائيات','chart'],['tips','نصائح','bulb']];
const TIPS=[['التذكر النشط','اقفل الكتاب واشرح اللي ذاكرته من الذاكرة، وده أقوى من إعادة القراءة.'],['المراجعة المتباعدة','راجع بعد يوم ثم 3 أيام ثم أسبوع، وزود المدة كل مرة.'],['بومودورو','25 دقيقة تركيز و5 راحة، وبعد 4 جولات خد راحة طويلة.'],['طريقة فاينمان','اشرح الفكرة بكلمات بسيطة كأنك بتعلّم حد، وارجع للجزء اللي وقفت فيه.'],['تبديل المواد','بدّل بين مادتين في اليوم بدل مادة واحدة طول اليوم.'],['الرسم','في التشريح والهستولوجي ارسم وسمّي الأجزاء بدل الحفظ النصي.']];
const DF=['','سهلة','متوسطة','صعبة'];

// الحالة والتخزين
const $=q=>document.querySelector(q),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K='dstudy1';let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S=Object.assign({theme:'dark',mid:{},lec:{},teach:{},log:{}},S);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const L=i=>S.lec[i]||(S.lec[i]=[]),TC=i=>S.teach[i]||(S.teach[i]=[]);
const td=()=>new Date().toLocaleDateString('en-CA'),dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const day=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString('en-CA')};
const pc=i=>{const l=L(i);return l.length?Math.round(l.filter(x=>x.done).length/l.length*100):0};
const hrs=i=>Object.values(S.log[i]||{}).reduce((a,b)=>a+b,0)/3600,tot=d=>SUBJ.reduce((a,s)=>a+((S.log[s.id]||{})[d]||0),0);

const stk=()=>{let n=tot(td())?0:1,c=0;while(tot(day(n))>0){c++;n++}return c};
// الصور في IndexedDB (مع بديل في الذاكرة)
const MI={},db=new Promise(r=>{try{const q=indexedDB.open('dimg',1);q.onupgradeneeded=()=>q.result.createObjectStore('i');q.onsuccess=()=>r(q.result);q.onerror=()=>r(0)}catch(e){r(0)}});
const idb=(m,k,v)=>db.then(d=>new Promise(r=>{if(!d){if(m=='put')MI[k]=v;if(m=='del')delete MI[k];return r(MI[k])}try{const s=d.transaction('i',m=='get'?'readonly':'readwrite').objectStore('i'),q=m=='get'?s.get(k):m=='put'?s.put(v,k):s.delete(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}}));
const rd=f=>new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.onerror=()=>r(null);x.readAsDataURL(f)});
const shrink=(u,m)=>new Promise(r=>{if(!u)return r(null);const i=new Image;i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.65))};i.onerror=()=>r(u);i.src=u});
const hy=()=>{document.querySelectorAll('img[data-k]').forEach(async i=>{const v=await idb('get',i.dataset.k);if(v)i.src=v});const b=$('#bn');if(b)idb('get','ban_'+V).then(v=>{if(v)b.style.backgroundImage=`linear-gradient(#0000,#0009),url(${v})`})};

// النوافذ
const M=h=>{$('#mo').innerHTML=`<div class="mo"><div class="md">${h}</div></div>`},X=()=>{$('#mo').innerHTML=''};
let V='home',Q='',FC={a:[],i:0,f:0};const cur=()=>SUBJ.find(s=>s.id==V);

// الرئيسية
function Home(){
const t=td(),up=SUBJ.filter(s=>S.mid[s.id]&&dd(S.mid[s.id],t)>=0).map(s=>({s,d:dd(S.mid[s.id],t)})).sort((a,b)=>a.d-b.d),m=up[0];
const msg=m?(m.d?`باقي ${m.d} يوم على ميد ${m.s.n}`:`اليوم ميد في مادة ${m.s.n}`):Object.keys(S.mid).length?'لا توجد ميدات قادمة':'حدد مواعيد الميد من زر الإعدادات';
const cols=Math.max(1,...SUBJ.map(s=>L(s.id).length)),all=SUBJ.reduce((a,s)=>a.concat(L(s.id)),[]),ad=all.filter(x=>x.done).length;
return `<div class="bn"><small>${new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</small><h1>مرحبا salam</h1><span class="pill ${m?(m.d==0?'hot':m.d<=3?'warn':''):''}">${msg}</span> <span class="pill">${ic('fire')} ${stk()}</span><div class="bar" style="--k:#fff;background:#ffffff40;margin:12px 0 4px"><i style="width:${Math.min(100,tot(t)/60/(S.goal||120)*100)}%"></i></div><small>${Math.round(tot(t)/60)} من ${S.goal||120} دقيقة اليوم</small></div>
<div class="gr">${SUBJ.map(s=>`<div class="c sc" style="--k:${s.c}" data-a="go" data-v="${s.id}"><div class="ico" style="--p:${pc(s.id)}"><span>${svg(s.i)}</span></div><b>${s.n}</b><small class="mu">${L(s.id).filter(x=>x.done).length} من ${L(s.id).length} محاضرة</small><div class="bar"><i style="width:${pc(s.id)}%"></i></div></div>`).join('')}</div>
<h3 style="margin:18px 0 8px">جدول المتابعة</h3><div class="c tw"><table><tr><th></th>${Array.from({length:cols},(_,i)=>`<th>Lec ${i+1}</th>`).join('')}<th>%</th></tr>${SUBJ.map(s=>`<tr><td style="color:${s.c};font-weight:700;text-align:start">${s.n}</td>${Array.from({length:cols},(_,i)=>{const x=L(s.id)[i];return `<td>${x?`<span class="ck ${x.done?'on':''}" style="--k:${s.c}" title="${esc(x.t)}" data-a="tg" data-s="${s.id}" data-i="${x.id}">${x.done?ic('check'):''}</span>`:''}</td>`}).join('')}<td>${pc(s.id)}%</td></tr>`).join('')}<tr><td style="text-align:start"><b>الإجمالي</b></td><td colspan="${cols}"></td><td><b>${all.length?Math.round(ad/all.length*100):0}%</b></td></tr></table></div>`}

// صفحة المادة
const LC=(s,x)=>`<div class="c lc" style="--k:${s.c}"><div class="row"><span class="ck ${x.done?'on':''}" data-a="tg" data-s="${s.id}" data-i="${x.id}">${x.done?ic('check'):''}</span><b class="grow">${esc(x.t)}</b><span class="tag">${DF[x.d]}</span></div>${x.n?`<p class="nt">${esc(x.n)}</p>`:''}<div class="ims">${(x.im||[]).map(k=>`<img data-k="${k}" alt="">`).join('')}</div><div class="row sm mu" style="margin-top:8px">آخر مراجعة: ${x.rv||'لم تتم'}<span class="grow"></span><button class="ib" data-a="rv" data-s="${s.id}" data-i="${x.id}">${ic('check')} راجعت</button><button class="ib" data-a="sy" data-s="${s.id}" data-i="${x.id}">${ic('spark')}</button><button class="ib" data-a="cd" data-s="${s.id}" data-i="${x.id}">${ic('cards')}</button><button class="ib" data-a="mv" data-k="-1" data-s="${s.id}" data-i="${x.id}">${ic('up')}</button><button class="ib" data-a="mv" data-k="1" data-s="${s.id}" data-i="${x.id}">${ic('dn')}</button><button class="ib" data-a="ed" data-s="${s.id}" data-i="${x.id}">${ic('edit')}</button><button class="ib" data-a="dl" data-s="${s.id}" data-i="${x.id}">${ic('trash')}</button></div></div>`;
const LL=s=>{const q=Q.trim().toLowerCase(),a=L(s.id).filter(x=>!q||(x.t+x.n).toLowerCase().includes(q));return a.length?a.map(x=>LC(s,x)).join(''):'<p class="mu">لا توجد محاضرات، اضغط على إضافة خانة</p>'};
function Sub(){const s=cur(),u=BANNERS[s.id];
return `<div style="--ac:${s.c}"><div class="row" style="margin-bottom:10px"><button class="ib" data-a="go" data-v="home">${ic('back')} رجوع</button></div>
<div class="sb" id="bn" style="--k:${s.c};${u?`background-image:linear-gradient(#0000,#0009),url(${u})`:''}"><span>${s.n}</span><label class="ib" style="color:#fff;background:#0006;border:0">${ic('img')}<input type="file" id="bf" accept="image/*" hidden></label></div>
<div class="c"><div class="row"><b class="grow">${pc(s.id)}% مكتمل</b><button class="b" data-a="al">${ic('plus')} إضافة خانة</button></div><div class="bar" style="margin-top:10px;--k:${s.c}"><i style="width:${pc(s.id)}%"></i></div></div>
<input id="q" placeholder="بحث في المحاضرات" value="${esc(Q)}"><div id="ll">${LL(s)}</div>
<div class="row" style="margin:16px 0 8px"><h3 class="grow">أحسن المدرسين</h3><button class="b g" data-a="at">${ic('plus')} إضافة</button></div>
${TC(s.id).map(x=>`<div class="c row"><div class="grow"><b>${esc(x.n)}</b><div class="mu sm">${esc(x.t)}</div>${/^https?:\/\//.test(x.u)?`<a href="${esc(x.u)}" target="_blank" rel="noopener" style="color:var(--ac)">فتح الرابط</a>`:''}</div><button class="ib" data-a="dt" data-s="${s.id}" data-i="${x.id}">${ic('trash')}</button></div>`).join('')||'<p class="mu">لم تضف مدرسين بعد</p>'}</div>`}
function LF(sid,id){const x=id?L(sid).find(y=>y.id==id):{t:'Lec '+(L(sid).length+1),n:'',d:2};
M(`<h3>${id?'تعديل':'إضافة'} خانة</h3><input id="ft" value="${esc(x.t)}" placeholder="العنوان"><textarea id="fn" rows="6" placeholder="ملاحظات (للكروت: كل سطر مصطلح : تعريف)">${esc(x.n)}</textarea><select id="fd">${[1,2,3].map(v=>`<option value="${v}" ${x.d==v?'selected':''}>${DF[v]}</option>`).join('')}</select><label class="b g" style="margin:6px 0">${ic('img')} إضافة صور<input type="file" id="fi" accept="image/*" multiple hidden></label> <span id="fc" class="mu sm"></span><div class="row" style="margin-top:8px"><button class="b" data-a="sv" data-s="${sid}" data-i="${id||''}">حفظ</button><button class="b g" data-a="x">إلغاء</button></div>`)}
const cards=t=>t.split('\n').map(l=>l.split(/\s*[:：=]\s*|\s+-\s+/)).filter(a=>a.length>1&&a[0].trim()&&a[0].length<70).map(a=>[a[0].trim(),a.slice(1).join(' ').trim()]);
const FM=()=>M(FC.a.length?`<h3>فلاش كاردز ${FC.i+1}/${FC.a.length}</h3><div class="c" data-a="fl" style="min-height:140px;display:grid;place-items:center;text-align:center;cursor:pointer;font-size:1.2rem">${esc(FC.a[FC.i][FC.f?1:0])}</div><div class="row"><button class="b" data-a="fn">${ic('next')} التالي</button><button class="b g" data-a="x">إغلاق</button></div><small class="mu">اضغط على الكارت لقلبه</small>`:`<h3>لا توجد كروت</h3><p class="mu" style="margin-bottom:10px">اكتب في الملاحظات كل سطر بصيغة: مصطلح : تعريف</p><button class="b g" data-a="x">إغلاق</button>`);

const W=t=>t.toLowerCase().match(/[\p{L}\p{N}]{3,}/gu)||[];
const ask=q=>{const w=W(q);if(!w.length)return'';const r=[];SUBJ.forEach(s=>L(s.id).forEach(x=>x.n.split('\n').forEach(l=>{const m=W(l),h=w.filter(k=>m.some(z=>z.includes(k)||k.includes(z))).length;if(h)r.push([h,s,x,l])})));return r.sort((a,b)=>b[0]-a[0]).slice(0,5).map(([,s,x,l])=>`<p class="sm" style="margin-top:8px"><b style="color:${s.c}">${s.n} - ${esc(x.t)}</b><br>${esc(l)}</p>`).join('')||'<p class="mu sm">لا نتائج</p>'};
const summ=t=>{const ls=t.split(/\n|(?<=[.!؟?])\s+/).map(x=>x.trim()).filter(x=>x.length>12),f={};ls.forEach(l=>W(l).forEach(k=>f[k]=(f[k]||0)+1));return ls.map((l,i)=>[W(l).reduce((a,k)=>a+f[k],0)/Math.sqrt(W(l).length||1),i]).sort((a,b)=>b[0]-a[0]).slice(0,4).map(a=>a[1]).sort((a,b)=>a-b).map(i=>ls[i])};
let QZ={q:[],i:0,s:0,a:-1};
const qzM=()=>{const z=QZ,q=z.q[z.i];M(q?`<h3>سؤال ${z.i+1}/${z.q.length}</h3><p style="margin-bottom:8px">ما المقصود بـ: <b>${esc(q.t)}</b>؟</p>${q.o.map((o,i)=>`<button class="b g" style="display:block;width:100%;margin:6px 0;white-space:normal;text-align:start;${z.a>=0?(i==q.c?'border-color:#22c55e':i==z.a?'border-color:#ef4444':''):''}" data-a="qa" data-n="${i}">${esc(o)}</button>`).join('')}${z.a>=0?'<button class="b" data-a="qn">التالي</button>':''}`:`<h3>النتيجة</h3><p style="margin-bottom:10px">${z.s} من ${z.q.length}</p><button class="b g" data-a="x">إغلاق</button>`)};
// الذكاء (منطق محلي بدون إنترنت)
function AI(){const t=td(),IV=[0,7,4,2];
const rk=SUBJ.map(s=>{const r=L(s.id).filter(x=>!x.done),ad=r.length?r.reduce((a,x)=>a+x.d,0)/r.length:0,dm=S.mid[s.id]?dd(S.mid[s.id],t):-1;
return{s,r,sc:Math.max(0,(dm>=0?120/(dm+3):0)+r.length*1.5+ad*2-Math.min(hrs(s.id),10)*.3),why:[dm>=0?`الميد بعد ${dm} يوم`:'',`${r.length} محاضرة متبقية`,ad>=2.5?'صعوبة عالية':''].filter(Boolean).join(' - ')}}).sort((a,b)=>b.sc-a.sc);
const mx=rk[0].sc||1,sh=[90,55,35],pl=rk.filter(x=>x.sc>0).slice(0,3),due=[],al=[],av=SUBJ.filter(s=>L(s.id).length),ap=av.length?av.reduce((a,s)=>a+pc(s.id),0)/av.length:0;
SUBJ.forEach(s=>{L(s.id).forEach(x=>{if(x.done&&(!x.rv||dd(t,x.rv)>=IV[x.d]))due.push([s,x])});const dm=S.mid[s.id]?dd(S.mid[s.id],t):-1,n=L(s.id).filter(x=>!x.done).length;if(dm>=0&&dm<=7&&n)al.push(`${s.n}: الميد بعد ${dm} يوم وباقي ${n} محاضرة`);else if(L(s.id).length&&pc(s.id)<ap-25)al.push(`${s.n} متأخرة عن باقي المواد`)});
return `<div class="c"><b>${ic('spark')} اسأل ملاحظاتك</b><input id="ak" placeholder="اكتب سؤال أو مصطلح"><div id="ar"></div></div><div class="c row"><b class="grow">${ic('cards')} اختبار سريع من ملاحظاتك</b><button class="b" data-a="qz">ابدأ</button></div><div class="c"><b>${ic('spark')} ترتيب الأولويات</b>${rk.map((x,i)=>`<div style="margin-top:12px"><b style="color:${x.s.c}">${i+1}. ${x.s.n}</b><div class="bar" style="--k:${x.s.c};margin:4px 0"><i style="width:${x.sc/mx*100}%"></i></div><small class="mu">${x.why}</small></div>`).join('')}</div>
<div class="c"><b>خطة اليوم المقترحة</b>${pl.map((x,i)=>`<p style="margin-top:8px">${sh[i]} دقيقة في ${x.s.n}${x.r[0]?` - ابدأ بـ ${esc(x.r[0].t)}`:''}</p>`).join('')||'<p class="mu">أضف محاضرات ومواعيد الميد لتظهر الخطة</p>'}</div>
<div class="c"><b>مراجعة اليوم</b>${due.slice(0,8).map(([s,x])=>`<div class="row" style="margin-top:8px"><i class="dot" style="background:${s.c}"></i><span class="grow">${s.n} - ${esc(x.t)}</span><button class="ib" data-a="rv" data-s="${s.id}" data-i="${x.id}">${ic('check')}</button></div>`).join('')||'<p class="mu">لا توجد مراجعات مستحقة</p>'}</div>
<div class="c"><b>تنبيهات</b>${al.map(a=>`<p style="margin-top:8px">${a}</p>`).join('')||'<p class="mu">لا توجد تنبيهات</p>'}</div>`}

// التايمر والموسيقى
let TM={len:1500,left:1500,run:0,sub:'phy',h:0,c:0},PL=[],ci=0;const au=new Audio();au.volume=.7;
au.onended=()=>{ci=(ci+1)%PL.length;au.src=PL[ci].u;au.play().catch(()=>{})};au.onplay=au.onpause=()=>{if(V=='timer')R()};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const up=()=>{const e=$('#tt');if(e){e.textContent=fmt(TM.left);$('#tp').style.strokeDashoffset=339.3*(1-TM.left/TM.len)}};
function tk(){TM.left--;const l=S.log[TM.sub]||(S.log[TM.sub]={}),d=td();l[d]=(l[d]||0)+1;if(++TM.c%15==0)save();if(TM.left<=0){TM.run=0;TM.left=0;clearInterval(TM.h);save();navigator.vibrate&&navigator.vibrate(400);R();return}up()}
function Timer(){return `<div class="c tcard" style="text-align:center"><div class="row" style="justify-content:flex-end"><button class="ib" data-a="fo">${ic('timer')} وضع التركيز</button></div><select id="ts">${SUBJ.map(s=>`<option value="${s.id}" ${TM.sub==s.id?'selected':''}>${s.n}</option>`).join('')}</select>
<div class="ring"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="54"/><circle id="tp" class="tf" cx="60" cy="60" r="54" transform="rotate(-90 60 60)" style="stroke-dashoffset:${339.3*(1-TM.left/TM.len)}"/></svg><b id="tt">${fmt(TM.left)}</b></div>
<div class="row" style="justify-content:center"><button class="b" data-a="tr">${ic(TM.run?'pause':'play')} ${TM.run?'إيقاف مؤقت':'ابدأ'}</button><button class="b g" data-a="tz">${ic('reset')}</button></div>
<div class="row" style="justify-content:center;margin-top:10px">${[5,15,25,45,60].map(m=>`<button class="b g sm" data-a="tl" data-n="${m}">${m} د</button>`).join('')}</div></div>
<div class="c"><div class="row"><b class="grow">${ic('music')} الموسيقى</b><label class="b g sm">${ic('plus')} من الجهاز<input type="file" id="mf" accept="audio/*" multiple hidden></label></div>${PL.length?`<p style="margin:8px 0">${esc(PL[ci].n)}</p><div class="row"><button class="b" data-a="mp">${ic(au.paused?'play':'pause')}</button><button class="b g" data-a="mn">${ic('next')}</button><input type="range" id="vol" min="0" max="1" step="0.05" value="${au.volume}" style="flex:1"></div>`:'<p class="mu sm" style="margin-top:8px">اختر ملفات صوت من مكتبة الجهاز</p>'}</div>`}

// الإحصائيات والنصائح
function Stats(){const t=td(),w=[6,5,4,3,2,1,0],mx=Math.max(1,...w.map(n=>tot(day(n)))),mh=Math.max(.01,...SUBJ.map(s=>hrs(s.id)));let st=0;for(let n=tot(t)?0:1;tot(day(n))>0;n++)st++;
return `<div class="gr"><div class="c"><small class="mu">اليوم</small><h2>${Math.round(tot(t)/60)} د</h2></div><div class="c"><small class="mu">سلسلة الأيام</small><h2>${ic('fire')} ${st}</h2></div><div class="c"><small class="mu">إجمالي الساعات</small><h2>${SUBJ.reduce((a,s)=>a+hrs(s.id),0).toFixed(1)}</h2></div></div>
<div class="c"><b>آخر 7 أيام</b><div class="wk" style="margin-top:10px">${w.map(n=>`<div><i style="height:${Math.round(tot(day(n))/mx*90)+3}px"></i><small class="mu">${new Date(day(n)+'T12:00').toLocaleDateString('ar-EG',{weekday:'short'})}</small></div>`).join('')}</div></div>
<div class="c"><b>ساعات كل مادة</b>${SUBJ.map(s=>`<div style="margin-top:10px"><div class="row sm"><span class="grow">${s.n}</span><span>${hrs(s.id).toFixed(1)} س - ${pc(s.id)}% محاضرات</span></div><div class="bar" style="--k:${s.c}"><i style="width:${hrs(s.id)/mh*100}%"></i></div></div>`).join('')}</div>`}
function Tips(){const k=new Date().getDate()%TIPS.length;return `<div class="bn"><small>نصيحة اليوم</small><h2>${TIPS[k][0]}</h2><p>${TIPS[k][1]}</p></div>`+TIPS.map(t=>`<div class="c"><b>${t[0]}</b><p class="mu">${t[1]}</p></div>`).join('')}

// الأفعال
const A={
go:d=>{V=d.v;Q='';R();scrollTo(0,0)},
th:()=>{S.theme=S.theme=='dark'?'light':'dark';save();R()},
x:X,
tg:d=>{const x=L(d.s).find(y=>y.id==d.i);x.done=!x.done;if(x.done)x.rv=x.rv||td();save();R()},
rv:d=>{L(d.s).find(y=>y.id==d.i).rv=td();save();R()},
al:()=>LF(V),ed:d=>LF(d.s,d.i),
sv:async d=>{const t=$('#ft').value.trim()||'Lec',n=$('#fn').value,df=+$('#fd').value,ids=[];
for(const f of $('#fi').files){const k='i'+Date.now()+Math.random().toString(36).slice(2,6),v=await shrink(await rd(f),900);if(v){await idb('put',k,v);ids.push(k)}}
const a=L(d.s);if(d.i){const x=a.find(y=>y.id==d.i);Object.assign(x,{t,n,d:df});x.im=(x.im||[]).concat(ids)}else a.push({id:'l'+Date.now(),t,n,d:df,done:false,im:ids,rv:''});save();X();R()},
dl:d=>M(`<h3>حذف المحاضرة؟</h3><div class="row"><button class="b" data-a="dl2" data-s="${d.s}" data-i="${d.i}">حذف</button><button class="b g" data-a="x">إلغاء</button></div>`),
dl2:d=>{const a=L(d.s),i=a.findIndex(y=>y.id==d.i);(a[i].im||[]).forEach(k=>idb('del',k));a.splice(i,1);save();X();R()},
cd:d=>{FC={a:cards(L(d.s).find(y=>y.id==d.i).n),i:0,f:0};FM()},
fl:()=>{FC.f=FC.f?0:1;FM()},fn:()=>{FC.i=(FC.i+1)%FC.a.length;FC.f=0;FM()},
at:()=>M(`<h3>إضافة مدرس</h3><input id="tn" placeholder="اسم المدرس"><textarea id="tnt" rows="3" placeholder="ملاحظة"></textarea><input id="tu" dir="ltr" placeholder="رابط (اختياري)"><div class="row"><button class="b" data-a="tsv">حفظ</button><button class="b g" data-a="x">إلغاء</button></div>`),
tsv:()=>{const n=$('#tn').value.trim();if(!n)return;TC(V).push({id:'t'+Date.now(),n,t:$('#tnt').value,u:$('#tu').value.trim()});save();X();R()},
dt:d=>{TC(d.s).splice(TC(d.s).findIndex(y=>y.id==d.i),1);save();R()},
ss:()=>M(`<h3>مواعيد الميد</h3>${SUBJ.map(s=>`<label class="sm mu">${s.n}<input type="date" data-m="${s.id}" value="${S.mid[s.id]||''}"></label>`).join('')}<label class="sm mu">هدف المذاكرة اليومي بالدقائق<input type="number" id="gl" value="${S.goal||120}"></label><div class="row" style="margin:8px 0"><button class="b g sm" data-a="ex">${ic('dn')} تصدير نسخة</button><label class="b g sm">${ic('up')} استيراد<input type="file" id="imp" accept=".json" hidden></label></div><div class="row"><button class="b" data-a="sm">حفظ</button><button class="b g" data-a="x">إغلاق</button></div>`),
sm:()=>{document.querySelectorAll('input[data-m]').forEach(i=>{if(i.value)S.mid[i.dataset.m]=i.value;else delete S.mid[i.dataset.m]});S.goal=+$('#gl').value||120;save();X();R()},
tr:()=>{if(TM.run){TM.run=0;clearInterval(TM.h);save()}else{if(TM.left<=0)TM.left=TM.len;TM.run=1;TM.h=setInterval(tk,1000)}R()},
tz:()=>{TM.run=0;clearInterval(TM.h);TM.left=TM.len;save();R()},
tl:d=>{TM.run=0;clearInterval(TM.h);TM.len=TM.left=d.n*60;R()},
sy:d=>{const r=summ(L(d.s).find(y=>y.id==d.i).n);M(`<h3>ملخص</h3>${r.map(l=>`<p style="margin:6px 0">- ${esc(l)}</p>`).join('')||'<p class="mu">اكتب ملاحظات أطول أولًا</p>'}<button class="b g" data-a="x" style="margin-top:8px">إغلاق</button>`)},
mv:d=>{const a=L(d.s),i=a.findIndex(y=>y.id==d.i),j=i+ +d.k;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();R()},
qz:()=>{const cs=[];SUBJ.forEach(s=>L(s.id).forEach(x=>cs.push(...cards(x.n))));if(cs.length<4)return M('<h3>محتاج 4 كروت على الأقل</h3><p class="mu" style="margin-bottom:10px">اكتب الملاحظات بصيغة: مصطلح : تعريف</p><button class="b g" data-a="x">إغلاق</button>');const sh=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);QZ={q:sh(cs).slice(0,10).map(c=>{const o=sh([c[1],...sh(cs.filter(k=>k[1]!=c[1])).slice(0,3).map(k=>k[1])]);return{t:c[0],o,c:o.indexOf(c[1])}}),i:0,s:0,a:-1};qzM()},
qa:d=>{if(QZ.a>=0)return;QZ.a=+d.n;if(QZ.a==QZ.q[QZ.i].c)QZ.s++;qzM()},
qn:()=>{QZ.i++;QZ.a=-1;qzM()},
ex:async()=>{const o={S,im:{}},ks=SUBJ.map(s=>'ban_'+s.id);SUBJ.forEach(s=>L(s.id).forEach(x=>ks.push(...(x.im||[]))));for(const k of ks){const v=await idb('get',k);if(v)o.im[k]=v}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='study-backup-'+td()+'.json';a.click()},
fo:()=>{document.body.classList.toggle('fo')},
mp:()=>{if(au.paused)au.play().catch(()=>{});else au.pause()},
mn:()=>{ci=(ci+1)%PL.length;au.src=PL[ci].u;au.play().catch(()=>{});R()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset);else if(e.target.classList.contains('mo'))X()});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='q'){Q=t.value;$('#ll').innerHTML=LL(cur());hy()}if(t.id=='vol')au.volume=t.value;if(t.id=='ak')$('#ar').innerHTML=ask(t.value)});
document.addEventListener('change',async e=>{const t=e.target;
if(t.id=='ts')TM.sub=t.value;
if(t.id=='fi')$('#fc').textContent=t.files.length+' صورة';
if(t.id=='imp'&&t.files[0]){try{const o=JSON.parse(await t.files[0].text());Object.assign(S,o.S);for(const k in o.im)await idb('put',k,o.im[k]);save();X();R()}catch(e){M('<h3>الملف غير صالح</h3><button class="b g" data-a="x">إغلاق</button>')}}
if(t.id=='bf'&&t.files[0]){await idb('put','ban_'+V,await shrink(await rd(t.files[0]),1200));R()}
if(t.id=='mf'){const first=!PL.length;[...t.files].forEach(f=>PL.push({n:f.name.replace(/\.[^.]+$/,''),u:URL.createObjectURL(f)}));if(first){ci=0;au.src=PL[0].u}R()}});

document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.code=='Space'&&V=='timer'){e.preventDefault();A.tr()}if(e.key=='f')A.fo()});
// الرسم
function R(){document.documentElement.dataset.theme=S.theme;
$('#tabs').innerHTML=TABS.map(t=>`<button class="tab ${t[0]==V||(t[0]=='home'&&!['ai','timer','stats','tips'].includes(V))?'on':''}" data-a="go" data-v="${t[0]}">${ic(t[2])}${t[1]}</button>`).join('');
$('#th').innerHTML=ic(S.theme=='dark'?'sun':'moon');$('#hs').innerHTML=ic('set');
$('#m').innerHTML=({home:Home,ai:AI,timer:Timer,stats:Stats,tips:Tips}[V]||Sub)();hy()}
document.body.classList.add('in');setTimeout(()=>document.body.classList.remove('in'),1200);R();
